# Atualização mensal dos dados: traz as camadas do R2, rebaixa da API do Tesouro os dois
# últimos exercícios fechados (os entes retificam declarações), reprocessa, valida e devolve
# ao R2. O site lê do R2, então passa a mostrar os dados novos sem precisar republicar.
name: Atualizar dados

on:
  schedule:
    - cron: "0 6 5 * *"   # dia 5 de cada mês, 03h de Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Exercícios a rebaixar, separados por espaço (ex.: 2024 2025). Vazio = os dois últimos fechados."
        required: false
        default: ""

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ~1h50 por exercício na API (1 req/s) + processamento
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Definir exercícios
        id: anos
        env:
          ANOS_INFORMADOS: ${{ inputs.anos }}
        run: |
          if [ -n "$ANOS_INFORMADOS" ]; then
            if ! [[ "$ANOS_INFORMADOS" =~ ^[0-9[:space:]-]+$ ]]; then
              echo "Exercícios inválidos: $ANOS_INFORMADOS" >&2; exit 1
            fi
            anos="$ANOS_INFORMADOS"
          else
            ano=$(date -u +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          echo "Exercícios: $anos"
          echo "anos=$anos" >> "$GITHUB_OUTPUT"

      - name: Baixar camadas atuais do R2
        run: python pipeline/r2.py baixar --camadas silver gold

      - name: Extrair da API do Tesouro
        run: python pipeline/extract.py --anos ${{ steps.anos.outputs.anos }} --atualizar

      - name: Processar e validar
        run: python pipeline/processar.py --anos ${{ steps.anos.outputs.anos }}

      - name: Enviar ao R2
        run: python pipeline/r2.py enviar

      - name: Guardar logs e validação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.run_id }}
          path: |
            data/logs/
            data/gold/validacao.csv
            data/gold/validacao_divergencias.csv
          if-no-files-found: ignore
          retention-days: 90
