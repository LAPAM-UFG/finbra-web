# Atualização mensal dos dados: traz as camadas do R2, rebaixa da API do Tesouro os dois
# últimos exercícios fechados (os entes retificam declarações), reprocessa, valida e devolve
# ao R2. O site lê do R2, então passa a mostrar os dados novos sem precisar republicar.
name: Atualizar dados

on:
  schedule:
    - cron: "0 6 5 * *"   # dia 5 de cada mês, 03h de Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Exercícios a rebaixar, separados por espaço (ex.: 2024 2025). Vazio = os dois últimos fechados."
        required: false
        default: ""

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Reservar espaço para as bases e os formatos de download
        run: |
          # SDKs sem uso neste job, em uma máquina descartável do GitHub.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc
          df -h "$RUNNER_TEMP"
          echo "DATA_DIR=$RUNNER_TEMP/finbra-fiscal" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-atualizacao.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências
        run: |
          pip install -r pipeline/requirements-atualizacao.txt
          npm ci --prefix web
          npm ci --prefix worker
          Rscript -e 'install.packages(c("arrow", "jsonlite"))'

      - name: Definir exercícios
        id: anos
        env:
          ANOS_INFORMADOS: ${{ inputs.anos }}
        run: |
          if [ -n "$ANOS_INFORMADOS" ]; then
            if ! [[ "$ANOS_INFORMADOS" =~ ^[0-9[:space:]-]+$ ]]; then
              echo "Exercícios inválidos: $ANOS_INFORMADOS" >&2; exit 1
            fi
            anos="$ANOS_INFORMADOS"
          else
            ano=$(date -u +%Y)
            anos="$((ano - 2)) $((ano - 1))"
          fi
          echo "Exercícios: $anos"
          echo "anos=$anos" >> "$GITHUB_OUTPUT"

      - name: Fixar somente as entradas fiscais atuais
        run: python pipeline/atualizar_bases.py --raiz "$DATA_DIR" --preparar-fiscal fiscal

      - name: Extrair da API do Tesouro
        run: python pipeline/extract.py --anos ${{ steps.anos.outputs.anos }} --atualizar

      - name: Processar e validar
        run: python pipeline/processar.py --anos ${{ steps.anos.outputs.anos }}

      - name: Validar código e proteções
        run: |
          python -m unittest discover -s pipeline -p 'testes_atualizacao*.py'
          npm run build --prefix web
      - name: Preparar derivados e publicar a edição completa
        run: python pipeline/atualizar_bases.py --raiz "${{ runner.temp }}/finbra-atualizacao-fiscal" --base-extra "$DATA_DIR" --raw-area fiscal --fontes ipca pbf --rscript "$(command -v Rscript)" --publicar

      - name: Guardar logs e validação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.run_id }}
          path: |
            ${{ env.DATA_DIR }}/logs/
            ${{ env.DATA_DIR }}/gold/validacao.csv
            ${{ env.DATA_DIR }}/gold/validacao_divergencias.csv
            ${{ runner.temp }}/finbra-atualizacao-fiscal/resultado.json
            ${{ runner.temp }}/finbra-atualizacao-fiscal/**/auditoria*.json
            ${{ runner.temp }}/finbra-atualizacao-fiscal/backup_r2/
          if-no-files-found: ignore
          retention-days: 90
