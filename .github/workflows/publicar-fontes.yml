name: Publicar ponte privada de coleta no Brasil
on:
  push:
    branches: [main]
    paths: ['worker_fontes/**', '.github/workflows/publicar-fontes.yml']
  workflow_dispatch:
concurrency:
  group: publicar-fontes
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: node --test worker_fontes/testes/ponte.test.mjs
      - name: Publicar serviço de coleta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node worker/node_modules/wrangler/bin/wrangler.js deploy --config worker_fontes/wrangler.jsonc
      - name: Configurar autenticação restrita à coleta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node worker_fontes/configurar_segredo.mjs
      - name: Conferir os catálogos e seis arquivos oficiais a partir do GitHub
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node worker_fontes/conferir.mjs
