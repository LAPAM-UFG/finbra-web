# Publica o site na Cloudflare (Worker + arquivos estáticos) a cada mudança no site ou no Worker.
# Os dados não passam por aqui: o Worker lê direto do R2, atualizado pela Action "Atualizar dados".
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "worker/**"
      - ".github/workflows/publicar-site.yml"
  workflow_dispatch:

concurrency:
  group: publicar-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Compilar o site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publicar na Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
